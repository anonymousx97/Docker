name: Publish-Docker-Image-native

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-images:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    outputs:
      amd64-digest: ${{ steps.save-outputs.outputs.amd64-digest }}
      arm64-digest: ${{ steps.save-outputs.outputs.arm64-digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest to job outputs
        id: save-outputs
        run: |
          echo "${{ matrix.arch }}-digest=${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT

  create-manifest:
    needs: build-images
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi architecture manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}:main \
            ${{ env.IMAGE }}@${{ needs.build-images.outputs.amd64-digest }} \
            ${{ env.IMAGE }}@${{ needs.build-images.outputs.arm64-digest }}
            
